<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobMatch AI: vagas avaliadas por IA, candidatura com revisão humana</title>
    <meta
      name="description"
      content="Projeto open source que recolhe vagas, avalia cada uma contra o teu perfil com um LLM e avisa no Telegram. Custo zero, chaves tuas, tu decides onde candidatar."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobMatch AI" />
    <meta
      property="og:description"
      content="Vagas encontradas, avaliadas por IA contra o teu perfil e entregues no Telegram. Open source, custo zero, BYOK."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
