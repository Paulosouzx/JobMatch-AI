<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobMatch AI: vagas avaliadas por IA, candidatura com revisão humana</title>
    <meta
      name="description"
      content="Projeto open source que recolhe vagas, avalia cada uma contra o teu perfil com um LLM e envia uma notificação das melhores. Custo zero, chaves tuas, tu decides onde candidatar."
    />
    <meta name="theme-color" content="#12200a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobMatch AI" />
    <meta
      property="og:description"
      content="Vagas encontradas, avaliadas por IA contra o teu perfil e entregues como notificação. Open source, custo zero, BYOK."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var stored = localStorage.getItem('theme');
        var dark =
          stored === 'dark' ||
          ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var palette = new URLSearchParams(location.search).get('palette');
        if (palette) localStorage.setItem('palette', palette);
        palette = palette || localStorage.getItem('palette');
        if (palette) document.documentElement.setAttribute('data-palette', palette);
      } catch (e) {}
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #fbfcfe;
        font-family: 'Bricolage Grotesque', Inter, system-ui, sans-serif;
      }
      html.dark #boot {
        background: #0f141b;
      }
      #boot .radar {
        position: relative;
        width: 112px;
        height: 112px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot .ring {
        position: absolute;
        border-radius: 999px;
        border: 1px solid rgba(79, 122, 12, 0.25);
      }
      #boot .sweep {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(181, 230, 29, 0.45) 50deg,
          transparent 90deg
        );
        animation: boot-spin 2.4s linear infinite;
      }
      #boot .mark {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #ddff4c;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(79, 122, 12, 0.3);
      }
      #boot .name {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #16202c;
      }
      html.dark #boot .name {
        color: #f3f6fa;
      }
      #boot .name span {
        color: #4f7a0c;
      }
      html.dark #boot .name span {
        color: #ddff4c;
      }
      #boot .bar {
        width: 128px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(79, 122, 12, 0.14);
      }
      #boot .bar div {
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: #84b814;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .sweep,
        #boot .bar div {
          animation: none;
        }
      }
    </style>
    <script
      defer
      src="https://paulosouzx.netlify.app/tracker.js"
      data-project-id="jobmatch-ai"
      data-endpoint="https://paulosouzx.netlify.app/.netlify/functions/track"
    ></script>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="A carregar">
        <div class="radar">
          <div class="ring" style="inset: 0"></div>
          <div class="ring" style="inset: 16px"></div>
          <div class="sweep"></div>
          <div class="mark">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0f110c"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" />
              <path d="M4 6h.01" />
              <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" />
              <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" />
              <path d="M12 18h.01" />
              <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" />
              <circle cx="12" cy="12" r="2" />
              <path d="m13.41 10.59 5.66-5.66" />
            </svg>
          </div>
        </div>
        <div class="name">JobMatch<span> AI</span></div>
        <div class="bar"><div></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
